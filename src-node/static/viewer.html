<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IFC MCP Viewer</title>
  <style>
    html,
    body,
    bim-grid {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
    }
  </style>
</head>
<body>
  <bim-grid id="ifc-viewer"></bim-grid>

  <script type="module">
    import { IfcViewer } from "https://cdn.flinker.app/ifc-viewer/v3.4.6/ifc-viewer.es.js";
    import { toolResult, toolError, bcfToolResult } from "/tool-results.js";

    async function bytesFrom(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      return new Uint8Array(await response.arrayBuffer());
    }

    async function syncState(result = {}) {
      const response = await fetch("/state", { method: "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(result) });
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      return response.json();
    }

    try {
      const viewer = new IfcViewer("#ifc-viewer");
      window.ifcMcpViewer = viewer;
      await viewer.ready;

      const loadedModels = new Set();
      let loadedBcfVersion = 0;

      async function loadModels(state) {
        const models = Array.isArray(state.models) ? state.models : [];
        const stateModelIds = new Set(models.map((model) => model.id).filter(Boolean));
        const hasStaleModels = [...loadedModels].some((id) => !stateModelIds.has(id));
        if (hasStaleModels || (!models.length && loadedModels.size)) {
          await viewer.clear();
          loadedModels.clear();
          loadedBcfVersion = 0;
        }

        for (const model of models) {
          if (!model.id || loadedModels.has(model.id)) {
            continue;
          }
          await viewer.add(
            model.filename || "model.ifc",
            await bytesFrom(`/models/${encodeURIComponent(model.id)}`)
          );
          loadedModels.add(model.id);
        }
      }

      async function applyBcfState(state) {
        if (!state.has_bcf || state.bcf_version <= loadedBcfVersion) {
          return;
        }

        try {
          const safeName = state.bcf_filename || "viewpoint.bcfzip";
          const versionedName = `${state.bcf_version}-${safeName}`;
          let result = await viewer.add(
            versionedName,
            await bytesFrom(`/bcf?version=${state.bcf_version}`)
          );

          // Released viewer builds return import diagnostics before topic selection.
          if (!Array.isArray(result?.content) && state.bcf_topic_guid && typeof viewer.select === "function"
            && !["applied", "partial"].includes(result?.application)) {
            const selected = await viewer.select(state.bcf_topic_guid);
            if (selected) result = { ...result, ...selected, issues: [...(result?.issues || []), ...(selected.issues || [])] };
          }
          return bcfToolResult(result);
        } finally {
          loadedBcfVersion = state.bcf_version;
        }
      }

      let syncing = false;
      let reply = null;
      async function syncViewer() {
        if (syncing) return;
        syncing = true;
        try {
          const state = await syncState();
          document.title = state.title || "IFC MCP Viewer";
          if (!reply || reply.id !== state.request_id) {
            let result;
            try {
              await loadModels(state);
              result = await applyBcfState(state) || toolResult("Viewer updated.");
            } catch (error) {
              result = toolError(error);
              console.warn("Viewer request failed", error);
            }
            reply = state.request_id ? { id: state.request_id, result } : null;
          }
          if (reply) { await syncState(reply); reply = null; }
        } finally {
          syncing = false;
        }
      }

      await syncViewer();

      window.setInterval(async () => {
        try {
          await syncViewer();
        } catch (error) {
          console.warn("IFC MCP state poll failed", error);
        }
      }, 1000);
    } catch (error) {
      console.error(error);
    }
  </script>
</body>
</html>
